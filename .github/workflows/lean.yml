name: Lean proof check

# Runs on every pushed branch. Every run gives ONE result for its commit: green iff the proofs check.
# * route (GitHub-hosted, seconds): what changed, and whether a verified build cache exists for exactly these
#   node-cap sources (the cache key carries the caps digest, scripts/caps_stamp.py).
# * check: the build and every check, on the runner the route chose:
#   - GitHub-hosted (usual): restores the verified cache; `lake build Grothe` replays the node caps in seconds;
#   - the droplet (self-hosted, labels self-hosted+heavy), when no verified cache matches (the node-cap sources
#     changed, or a new toolchain): a cold cap build takes hours, beyond a GitHub job. It builds in its persistent
#     workspace, checks, marks the caps (caps-closure.sha) and saves the verified cache. While it runs the commit
#     shows "pending"; a cache miss never shows as a failure.
# * finish (GitHub-hosted): master: prune old master caches; ready/<name>: fast-forward master to the checked merge.
# ready/<name>: the branch is merged into the CURRENT master and the MERGED tree is checked; master moves only if green.
# Master's cache: every update of master gets one check on master (a hand merge by its push; an auto-merge
# dispatches it); when green, it saves the new master cache. Only master runs and droplet runs write caches.
# Tree handoff: a green branch check whose commit contains the current master uploads its build as the artifact
# lean-build-tree-<tree hash> (caches of a branch are invisible to master; artifacts are not). When master later
# points at exactly that tree (the CI fast-forward of a ready/ branch, or a hand merge of an up-to-date pull request),
# master's check downloads it instead of the older master cache, so its build only replays.
# See AGENTS.md section 10.

on:
  push:
    # cloud/** are scratch branches for cloud jobs (cloud.yml, AGENTS.md section 11): no push check
    branches: ['**', '!cloud/**']
  schedule:
    # weekly: restore (and so keep alive) the master cache; GitHub deletes cache entries unused for 7 days
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "check (default: the route picks the runner) or caps (force the droplet build)"
        default: check
        type: choice
        options: [check, caps]

permissions:
  contents: write
  actions: write
  issues: write
  statuses: write

jobs:
  route:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lean: ${{ steps.scope.outputs.lean }}
      droplet: ${{ steps.where.outputs.droplet }}
      runs_on: ${{ steps.where.outputs.runs_on }}
      key: ${{ steps.where.outputs.key }}
      handoff_run: ${{ steps.where.outputs.handoff_run }}
      handoff_name: ${{ steps.where.outputs.handoff_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge the ready branch into the current master
        if: startsWith(github.ref_name, 'ready/')
        run: |
          git config user.name "grothe-ci"; git config user.email "grothe-ci@users.noreply.github.com"
          git fetch -q origin master
          git checkout -q -B merge-candidate origin/master
          git merge -q --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge ${GITHUB_REF_NAME} (CI auto-merge)"

      - name: Does this change touch anything Lean builds or checks?
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # a branch commit already contained in master: master's own check covers it
          if [ "${GITHUB_REF_NAME}" != master ] && [[ "${GITHUB_REF_NAME}" != ready/* ]]; then
            git fetch -q origin master
            if git merge-base --is-ancestor HEAD origin/master; then
              echo "already contained in master: skipping this branch check"; echo "lean=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # files that affect the Lean build or its checks; everything else (README, docs/, AGENTS.md, ...) needs no build
          LEAN_PATHS='^(Grothe/|GrotheKernel/|GrotheCapsKernel/|Grothe\.lean$|GrotheKernel\.lean$|GrotheCapsKernel\.lean$|lakefile\.toml$|lake-manifest\.json$|lean-toolchain$|scratch/Axioms\.lean$|data/axioms/|data/root-imports-exclude\.txt$|tools/gen_root_imports\.py$|scripts/check_axioms\.py$|scripts/test_check_axioms\.py$|scripts/caps_stamp\.py$|scripts/test_caps_stamp\.py$|\.github/workflows/)'
          if [[ "${GITHUB_REF_NAME}" == ready/* ]]; then base=origin/master          # HEAD = master + this branch
          elif [ "${GITHUB_REF_NAME}" = master ]; then base="$BEFORE"                # the previous master
          else base=$(git merge-base origin/master HEAD); fi                         # what the branch adds to master
          if [ "${{ inputs.mode }}" = caps ] || [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "full check"; echo "lean=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE "$LEAN_PATHS"; then echo "lean=true" >> "$GITHUB_OUTPUT"
          else echo "no Lean-relevant file changed: skipping the build and the checks"; echo "lean=false" >> "$GITHUB_OUTPUT"; fi

      - name: Is there a verified build cache for these node-cap sources? (no -> the droplet builds them)
        id: where
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN: ${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
        run: |
          digest=$(python3 scripts/caps_stamp.py --digest | awk '/^sha256/ {print $2}')
          key="lake-build-v3-${TOOLCHAIN}-${digest}-"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          # a run can restore caches of its own branch and of master
          found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}&per_page=100" \
            --jq "[.actions_caches[] | select(.ref == \"refs/heads/master\" or .ref == \"${GITHUB_REF}\")] | length")
          echo "caps digest ${digest}: ${found} verified cache(s) usable by ${GITHUB_REF_NAME}"
          # master: a green branch check may already have built exactly this tree (the tree handoff)
          handoff=""
          if [ "${GITHUB_REF_NAME}" = master ] && [ "${{ steps.scope.outputs.lean }}" = true ] && [ "${{ inputs.mode }}" != caps ]; then
            name="lean-build-tree-$(git rev-parse 'HEAD^{tree}')"
            for run in $(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
                           --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); do
              # only builds made by this workflow's checks count
              if [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .path 2>/dev/null)" = .github/workflows/lean.yml ]; then
                handoff=$run; break
              fi
            done
            if [ -n "$handoff" ]; then
              echo "-> master's tree was already built and checked by run ${handoff}: using its build (${name})"
              echo "handoff_run=${handoff}" >> "$GITHUB_OUTPUT"; echo "handoff_name=${name}" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "${{ steps.scope.outputs.lean }}" = true ] && [ -z "$handoff" ] && { [ "${{ inputs.mode }}" = caps ] || [ "${found:-0}" = 0 ]; }; then
            echo "-> the droplet builds and verifies the node caps (this run stays pending meanwhile)"
            echo "droplet=true" >> "$GITHUB_OUTPUT"; echo 'runs_on=["self-hosted","heavy"]' >> "$GITHUB_OUTPUT"
          else
            echo "droplet=false" >> "$GITHUB_OUTPUT"; echo 'runs_on="ubuntu-24.04"' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.runs_on) }}
    timeout-minutes: ${{ needs.route.outputs.droplet == 'true' && 4320 || 360 }}
    # Branches (GitHub-hosted): one group PER BRANCH, cancel-in-progress (a new push supersedes the older check).
    # Master: never cancelled; every master commit gets its own check (a cancelled run marks its commit with a cross,
    # and a long first build would be lost), so its group is per commit. The droplet has one runner, so its jobs queue
    # by themselves and are never cancelled (a killed build leaves orphaned lean processes).
    concurrency:
      group: ${{ needs.route.outputs.droplet == 'true' && format('droplet-{0}', github.run_id) || (github.ref_name == 'master' && format('check-master-{0}', github.sha) || format('check-{0}', github.ref)) }}
      cancel-in-progress: ${{ needs.route.outputs.droplet != 'true' && github.ref_name != 'master' }}
    env:
      LEAN: ${{ needs.route.outputs.lean }}
      DROPLET: ${{ needs.route.outputs.droplet }}
      KEY: ${{ needs.route.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: ${{ needs.route.outputs.droplet != 'true' }}   # the droplet keeps its persistent .lake

      - name: Merge the ready branch into the current master
        if: startsWith(github.ref_name, 'ready/')
        run: |
          git config user.name "grothe-ci"; git config user.email "grothe-ci@users.noreply.github.com"
          git fetch origin master
          git checkout -B merge-candidate origin/master
          git merge --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge ${GITHUB_REF_NAME} (CI auto-merge)"
          git log --oneline -3
          printf 'base=%s\ntree=%s\n' "$(git rev-parse origin/master)" "$(git rev-parse 'HEAD^{tree}')" > merge-info

      - name: Download the build of this exact tree (master, tree handoff from a green branch check)
        if: env.LEAN == 'true' && needs.route.outputs.handoff_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.handoff_name }}
          run-id: ${{ needs.route.outputs.handoff_run }}
          github-token: ${{ github.token }}
          path: handoff-build

      - name: Unpack the handed-over build
        if: env.LEAN == 'true' && needs.route.outputs.handoff_run != ''
        run: |
          mkdir -p .lake && rm -rf .lake/build
          tar -I zstd -xf handoff-build/build.tar.zst -C .lake && rm -rf handoff-build
          echo "built by run ${{ needs.route.outputs.handoff_run }}: $(cat .lake/build/built-commit 2>/dev/null)"

      - name: Restore the verified build cache (GitHub-hosted, or an empty droplet workspace)
        if: env.LEAN == 'true' && needs.route.outputs.handoff_run == '' && hashFiles('.lake/build/lib/lean/Grothe.olean') == ''
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: ${{ needs.route.outputs.key }}${{ github.sha }}
          restore-keys: |
            ${{ needs.route.outputs.key }}
            lake-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Lean toolchain and Mathlib (GitHub-hosted, from the Mathlib cache)
        if: env.LEAN == 'true' && env.DROPLET != 'true'
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: false     # no per-branch cache entries: they evict each other in the 10 GB quota
          build: false

      - name: Lean toolchain and the shared Mathlib packages (droplet)
        if: env.LEAN == 'true' && env.DROPLET == 'true'
        run: |
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          mkdir -p .lake
          [ -e .lake/packages ] || ln -s /home/agalatan/grothe-caps/.lake/packages .lake/packages
          "$HOME/.elan/bin/lake" --version; df -h . | tail -1

      - name: Unit tests of the verification scripts (caps hash, axiom reports)
        if: env.LEAN == 'true'
        run: |
          python3 scripts/test_caps_stamp.py
          python3 scripts/test_check_axioms.py

      - name: The restored node caps are verified for these sources (GitHub-hosted)
        if: env.LEAN == 'true' && env.DROPLET != 'true'
        run: |
          python3 scripts/caps_stamp.py --check-cache || {
            echo "::error::The route found a verified cache for these sources, but the restored build does not match"
            echo "::error::(evicted meanwhile?). Re-run this workflow: the route will then send it to the droplet."
            exit 1; }

      - name: Build the scalar kernel proof first (droplet; it peaks at 18.8 GB RSS)
        if: env.LEAN == 'true' && env.DROPLET == 'true'
        run: lake build Grothe.Haagerup.ScalarTailRefinement --log-level=warning

      - name: Build Grothe (everything, node caps included)
        if: env.LEAN == 'true'
        run: lake build Grothe --log-level=warning

      - name: Root import files generated, list files sorted and duplicate-free
        if: env.LEAN == 'true'
        run: python3 tools/gen_root_imports.py --check

      - name: No sorry, axiom or unchecked code anywhere
        if: env.LEAN == 'true'
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b|^[[:space:]]*(private[[:space:]]+)?axiom[[:space:]]|implemented_by|@\[extern|\bunsafe\b|debug\.skipKernelTC|Task\.spawn' Grothe GrotheKernel GrotheCapsKernel Grothe.lean GrotheKernel.lean GrotheCapsKernel.lean

      - name: Axiom report
        if: env.LEAN == 'true'
        run: |
          lake env lean scratch/Axioms.lean | tee axioms.txt
          python3 scripts/check_axioms.py < axioms.txt

      - name: Mark the node caps as verified for these sources (droplet, after the build and the report)
        if: env.LEAN == 'true' && env.DROPLET == 'true'
        run: python3 scripts/caps_stamp.py --mark-cache

      - name: Lower-proof comment leaves the verified caps cache valid
        if: needs.route.outputs.droplet == 'true' && needs.route.outputs.lean == 'true'
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          original_head=$(git rev-parse HEAD)
          original_ref=$(git symbolic-ref -q HEAD || true)
          probe_branch="codex/caps-comment-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git show-ref --verify --quiet "refs/heads/$probe_branch"; then
            echo "Probe branch already exists; refusing to reuse it" >&2
            exit 1
          fi
          row_file=Grothe/LowerAnalytic/Bridge.lean
          row_backup=$(mktemp)
          cp "$row_file" "$row_backup"
          probe_created=false
          cleanup() {
            result=$?
            trap - EXIT
            # The backup also restores exact bytes if the Python process is interrupted.
            cp "$row_backup" "$row_file" || result=1
            if [ "$probe_created" = true ]; then
              if [ -n "$original_ref" ]; then
                git switch "${original_ref#refs/heads/}" || result=1
              else
                git switch --detach "$original_head" || result=1
              fi
              if [ "$(git rev-parse "refs/heads/$probe_branch")" = "$original_head" ]; then
                git branch -D "$probe_branch" || result=1
              else
                echo "Probe branch moved unexpectedly; refusing to delete it" >&2
                result=1
              fi
            fi
            rm -f "$row_backup" || result=1
            [ "$(git rev-parse HEAD)" = "$original_head" ] || result=1
            [ "$(git symbolic-ref -q HEAD || true)" = "$original_ref" ] || result=1
            git diff --quiet && git diff --cached --quiet || result=1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          git switch -c "$probe_branch" "$original_head"
          probe_created=true
          # The preceding build and audits supplied the genuine marker. Do not mark again.
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys

          path = Path("Grothe/LowerAnalytic/Bridge.lean")
          original = path.read_bytes()
          try:
              path.write_bytes(original + b"\n-- CI scratch probe: lower-proof comments leave caps computation unchanged.\n")
              subprocess.run([sys.executable, "scripts/caps_stamp.py", "--check-cache"], check=True)
          finally:
              path.write_bytes(original)
          PYTHON
          # EXIT restores HEAD/ref and removes the scratch branch before any cache is saved.

      - name: Record the built commit
        if: env.LEAN == 'true' && (github.ref_name == 'master' || env.DROPLET == 'true')
        run: git rev-parse HEAD > .lake/build/built-commit

      - name: Save the master cache (green check of master)
        if: env.LEAN == 'true' && github.ref_name == 'master'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ needs.route.outputs.key }}${{ github.sha }}

      - name: Save the verified cache for this branch (droplet; and ready/, so a re-check after master moved replays it)
        # deleted with the branch (cancel-merged.yml), so it never outlives the delivery
        if: env.LEAN == 'true' && github.ref_name != 'master' && (env.DROPLET == 'true' || startsWith(github.ref_name, 'ready/'))
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: ${{ needs.route.outputs.key }}${{ github.sha }}-run${{ github.run_id }}

      - name: Pack the build for master's check if master can become exactly this tree (tree handoff)
        # this commit contains the current master, so a ready/ fast-forward or a hand merge of the pull request gives
        # master exactly this tree; master's check then downloads this build instead of rebuilding
        id: handoff
        if: env.LEAN == 'true' && github.ref_name != 'master'
        run: |
          git fetch -q origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            git rev-parse HEAD > .lake/build/built-commit
            tar -I 'zstd -T0 -3' -cf build.tar.zst -C .lake build
            echo "name=lean-build-tree-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
            ls -l build.tar.zst
          else
            echo "master moved past this commit's base: no handoff"
          fi

      - name: Upload the build for master's check (tree handoff)
        if: steps.handoff.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.handoff.outputs.name }}
          path: build.tar.zst
          compression-level: 0
          retention-days: 1

      - name: Hand the checked merge to the finish job
        if: startsWith(github.ref_name, 'ready/')
        uses: actions/upload-artifact@v4
        with:
          name: merge-info
          path: merge-info
          retention-days: 1

  finish:
    # GitHub-hosted (has the GitHub CLI): after a green check
    needs: [route, build]
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'ready/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cancel the checks of older master commits (this green check covers their trees)
        # only what a viewer of master sees matters: the newest commit's own result. An older commit's check that is
        # still running is redundant once a newer commit containing it is green.
        if: github.ref_name == 'master' && needs.route.outputs.lean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/lean.yml/runs?branch=master&per_page=50" \
            --jq '.workflow_runs[] | select(.status != "completed") | "\(.id) \(.head_sha)"' |
          while read -r id sha; do
            [ "$id" = "${GITHUB_RUN_ID}" ] || [ "$sha" = "${GITHUB_SHA}" ] && continue
            # older = an ancestor of this commit (needs no checkout: the compare API answers it)
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${sha}...${GITHUB_SHA}" --jq .status 2>/dev/null || true)
            if [ "$status" = ahead ]; then
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 \
                && echo "cancelled the check of the older master commit ${sha:0:7} (run ${id})" || true
            fi
          done

      - name: Prune superseded master caches (keep the newest two)
        if: github.ref_name == 'master' && needs.route.outputs.lean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/master&key=lake-build-&sort=created_at&direction=desc&per_page=100" \
            --jq '.actions_caches[2:][] | .id' | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null && echo "deleted cache ${id}" || true
          done

      - uses: actions/checkout@v5
        if: startsWith(github.ref_name, 'ready/')
        with:
          fetch-depth: 0
          # MERGE_TOKEN (optional repository secret, fine-grained PAT with contents + workflows write) lets the
          # auto-merge push deliveries that change .github/workflows; the default token is refused for those
          token: ${{ secrets.MERGE_TOKEN || github.token }}

      - uses: actions/download-artifact@v4
        if: startsWith(github.ref_name, 'ready/')
        with:
          name: merge-info

      - name: Recreate exactly the checked merge
        if: startsWith(github.ref_name, 'ready/')
        run: |
          git config user.name "grothe-ci"; git config user.email "grothe-ci@users.noreply.github.com"
          . ./merge-info; rm merge-info
          git fetch -q origin master
          git checkout -q -B merge-candidate "$base"
          git merge -q --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge ${GITHUB_REF_NAME} (CI auto-merge)"
          [ "$(git rev-parse 'HEAD^{tree}')" = "$tree" ] || { echo "::error::the recreated merge differs from the checked tree"; exit 1; }
          echo "CHECKED_BASE=$base" >> "$GITHUB_ENV"

      - name: Auto-merge into master (fast-forward to the checked merge), or retry if master moved
        if: startsWith(github.ref_name, 'ready/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$CHECKED_BASE"   # the master the check merged with; the push below fails unless master is still there
          if [ "$(git rev-parse merge-candidate)" = "$base" ]; then
            # already merged (e.g. by hand through a pull request): master's own check covers it, nothing to push
            echo "${GITHUB_REF_NAME} is already contained in master: deleting it, no push, no new master check"
            git push origin --delete "${GITHUB_REF_NAME}" || true
            exit 0
          fi
          if git push origin merge-candidate:master; then
            git push origin --delete "${GITHUB_REF_NAME}"
            # the token push does not start a run on master: mark the merged commit as verified by this run
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse merge-candidate)" \
              -f state=success -f context="Lean proof check (verified before merge)" \
              -f description="Built and checked as ${GITHUB_REF_NAME} merged into master" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
            # a push by the workflow token does not trigger GitHub's "Closes #n" handling: close them here
            for n in $(git log --format=%B "$base"..merge-candidate \
                       | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              gh issue close "$n" --comment "Closed by ${GITHUB_REF_NAME} (CI auto-merge, $(git rev-parse --short merge-candidate))" || true
            done
            # the workflow-token push starts no run on master: dispatch master's check, which saves the master cache
            # (the route sends it to the droplet if the node caps changed)
            gh workflow run lean.yml --ref master || true
          else
            git fetch -q origin master
            if [ "$(git rev-parse origin/master)" != "$base" ]; then
              # not a failure: the delivery is fine, it just has to be checked against the new master
              echo "::notice::master moved during the check: re-dispatched ${GITHUB_REF_NAME} against the new master"
              gh workflow run lean.yml --ref "${GITHUB_REF_NAME}"
              exit 0
            elif git diff --name-only "$base" merge-candidate | grep -q '^\.github/workflows/'; then
              echo "::error::The push was refused because this delivery changes .github/workflows and the token may not"
              echo "::error::update workflows. Add the MERGE_TOKEN secret (see AGENTS.md section 9) or merge it with a PR."
            else
              echo "::error::The push to master was refused for another reason (see above). Not retrying."
            fi
            exit 1
          fi


  keepalive:
    # the weekly schedule: restoring the master cache counts as a use and resets GitHub's 7-day expiry
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Restore the master cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-v3-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
