name: Lean proof check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lean development (Mathlib from cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--log-level=warning"

      - name: No sorry, axiom or unchecked code anywhere
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b|^[[:space:]]*(private[[:space:]]+)?axiom[[:space:]]|implemented_by|@\[extern|\bunsafe\b|debug\.skipKernelTC' Grothe GrotheKernel Grothe.lean GrotheKernel.lean

      - name: Axiom report
        run: |
          lake env lean scratch/Axioms.lean | tee axioms.txt
          python3 scripts/check_axioms.py < axioms.txt

      - name: Node caps (separate target GrotheCaps, verified off CI) unchanged since verification
        run: python3 scripts/caps_stamp.py --check
