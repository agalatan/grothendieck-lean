name: Lean proof check

# Runs on every pushed branch (mode "check", GitHub-hosted runner).
# * master, claude/*, codex/*, ...: build and checks only.
# * ready/<name>: the branch is merged into the CURRENT master, the MERGED tree is built and checked, and on
#   success master is fast-forwarded to that merge (auto-merge). On failure master is untouched.
# Heavy work runs on the droplet (self-hosted runner, labels: self-hosted, heavy), dispatched by mode:
# * warm (on master, after every auto-merge): incremental build of Grothe + GrotheCaps in a persistent workspace,
#   both axiom reports, then saves .lake/build as the shared build cache that every run restores.
# * caps (on a branch whose cached GrotheCaps build does not match its sources): builds GrotheCaps for the tree CI
#   checks (for ready/: merged with master), marks and saves the cache for that branch, and re-dispatches the check.
# Cache policy: runner warm runs publish the master cache; runner caps runs publish a branch cache.
# GitHub-hosted checks only read these caches (see AGENTS.md section 4c).

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      mode:
        description: "check (default), warm (master, droplet) or caps (branch, droplet)"
        default: check
        type: choice
        options: [check, warm, caps]

permissions:
  contents: write
  actions: write
  issues: write
  statuses: write

jobs:
  build:
    if: github.event_name == 'push' || inputs.mode == 'check' || inputs.mode == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # One group PER BRANCH, cancel-in-progress: a new push (or retry dispatch) of the same branch cancels that
    # branch's older check run, which is now checking a superseded commit. Different branches never share a group,
    # so deliveries cannot cancel each other (a shared group once dropped pending deliveries). The droplet job
    # "heavy" has its own group and is never cancelled by this.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # MERGE_TOKEN (optional repository secret, fine-grained PAT with contents + workflows write) lets the
          # auto-merge push deliveries that change .github/workflows; the default token is refused for those
          token: ${{ secrets.MERGE_TOKEN || github.token }}

      - name: Merge the ready branch into the current master
        if: startsWith(github.ref_name, 'ready/')
        run: |
          git config user.name "grothe-ci"
          git config user.email "grothe-ci@users.noreply.github.com"
          git fetch origin master
          git checkout -B merge-candidate origin/master
          git merge --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge ${GITHUB_REF_NAME} (CI auto-merge)"
          git log --oneline -3

      - name: Does this change touch anything Lean builds or checks?
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # files that affect the Lean build or its checks; everything else (README, docs/, AGENTS.md, tools/, ...)
          # needs no build
          LEAN_PATHS='^(Grothe/|GrotheKernel/|GrotheCapsKernel/|Grothe\.lean$|GrotheKernel\.lean$|GrotheCapsKernel\.lean$|GrotheCaps\.lean$|lakefile\.toml$|lake-manifest\.json$|lean-toolchain$|scratch/Axioms\.lean$|scratch/AxiomsCaps\.lean$|data/axioms/|data/root-imports-exclude\.txt$|tools/gen_root_imports\.py$|scripts/check_axioms\.py$|scripts/test_check_axioms\.py$|scripts/caps_stamp\.py$|scripts/test_caps_stamp\.py$|\.github/workflows/)'
          if [[ "${GITHUB_REF_NAME}" == ready/* ]]; then base=origin/master          # HEAD = master + this branch
          elif [ "${GITHUB_REF_NAME}" = master ]; then base="$BEFORE"                # the previous master
          else base=$(git merge-base origin/master HEAD); fi                         # what the branch adds to master
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "no comparison base: full check"; echo "lean=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -qE "$LEAN_PATHS"; then echo "lean=true" >> "$GITHUB_OUTPUT"
          else echo "no Lean-relevant file changed: skipping the build and the checks"; echo "lean=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore the shared build cache (written only by master warm runs)
        if: steps.scope.outputs.lean == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Lean toolchain and Mathlib (from the Mathlib cache)
        if: steps.scope.outputs.lean == 'true'
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: false     # no per-branch cache entries: they evict each other in the 10 GB quota
          build: false

      - name: Unit tests of the verification scripts (caps hash, axiom reports)
        if: steps.scope.outputs.lean == 'true'
        run: |
          python3 scripts/test_caps_stamp.py
          python3 scripts/test_check_axioms.py

      - name: Is the cached GrotheCaps build verified for these sources?
        if: steps.scope.outputs.lean == 'true'
        id: caps
        run: |
          if python3 scripts/caps_stamp.py --check-cache; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build Grothe
        if: steps.scope.outputs.lean == 'true'
        run: lake build Grothe --log-level=warning

      - name: Root import files generated, list files sorted and duplicate-free
        if: steps.scope.outputs.lean == 'true'
        run: python3 tools/gen_root_imports.py --check

      - name: No sorry, axiom or unchecked code anywhere
        if: steps.scope.outputs.lean == 'true'
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b|^[[:space:]]*(private[[:space:]]+)?axiom[[:space:]]|implemented_by|@\[extern|\bunsafe\b|debug\.skipKernelTC|Task\.spawn' Grothe GrotheKernel GrotheCapsKernel Grothe.lean GrotheKernel.lean GrotheCapsKernel.lean

      - name: Axiom report
        if: steps.scope.outputs.lean == 'true'
        run: |
          lake env lean scratch/Axioms.lean | tee axioms.txt
          python3 scripts/check_axioms.py < axioms.txt

      - name: Build and check GrotheCaps (replayed from the verified cache)
        if: steps.scope.outputs.lean == 'true' && steps.caps.outputs.ok == 'true'
        run: |
          lake build GrotheCaps --log-level=warning
          lake env lean scratch/AxiomsCaps.lean | tee axioms-caps.txt
          python3 scripts/check_axioms.py --caps < axioms-caps.txt

      - name: GrotheCaps not verified for these sources — rebuild it on the droplet instead of timing out here
        if: steps.scope.outputs.lean == 'true' && steps.caps.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = master ]; then mode=warm; else mode=caps; fi
          echo "::error::The caps sources differ from the verified cached build (or there is no cache yet). Dispatched"
          echo "::error::a ${mode} run on the droplet; it builds GrotheCaps and re-dispatches this check. Nothing to do by hand."
          gh workflow run lean.yml --ref "${GITHUB_REF_NAME}" -f mode=${mode}
          exit 1

      - name: Auto-merge into master (fast-forward to the checked merge), or retry if master moved
        if: startsWith(github.ref_name, 'ready/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse origin/master)   # before the push updates origin/master
          if git push origin merge-candidate:master; then
            git push origin --delete "${GITHUB_REF_NAME}"
            # the token push does not start a run on master: mark the merged commit as verified by this run
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse merge-candidate)" \
              -f state=success -f context="Lean proof check (verified before merge)" \
              -f description="Built and checked as ${GITHUB_REF_NAME} merged into master" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
            # a push by the workflow token does not trigger GitHub's "Closes #n" handling: close them here
            for n in $(git log --format=%B "$base"..merge-candidate \
                       | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | sort -u); do
              gh issue close "$n" --comment "Closed by ${GITHUB_REF_NAME} (CI auto-merge, $(git rev-parse --short merge-candidate))" || true
            done
            # refresh the shared build cache from the new master on the droplet
            gh workflow run lean.yml --ref master -f mode=warm || true
          else
            git fetch -q origin master
            if [ "$(git rev-parse origin/master)" != "$base" ]; then
              echo "master moved during the build: re-dispatching this ready branch against the new master"
              gh workflow run lean.yml --ref "${GITHUB_REF_NAME}"
            elif git diff --name-only "$base" merge-candidate | grep -q '^\.github/workflows/'; then
              echo "::error::The push was refused because this delivery changes .github/workflows and the token may not"
              echo "::error::update workflows. Add the MERGE_TOKEN secret (see AGENTS.md section 4) or merge it with a PR."
            else
              echo "::error::The push to master was refused for another reason (see above). Not retrying."
            fi
            exit 1
          fi

  heavy:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'warm' || inputs.mode == 'caps')
    runs-on: [self-hosted, heavy]
    timeout-minutes: 4320
    # one heavy job at a time on the droplet; a newer pending warm run supersedes an older one
    concurrency:
      group: droplet-heavy
      cancel-in-progress: false
    env:
      SHARED_PACKAGES: /home/agalatan/grothe-caps/.lake/packages   # shared Mathlib packages on the droplet
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          clean: false                  # keep the persistent .lake between runs (incremental builds)

      - name: Merge the ready branch into the current master (caps mode on ready/)
        if: inputs.mode == 'caps' && startsWith(github.ref_name, 'ready/')
        run: |
          git config user.name "grothe-ci"
          git config user.email "grothe-ci@users.noreply.github.com"
          git fetch origin master
          git checkout -B merge-candidate origin/master
          git merge --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge ${GITHUB_REF_NAME} (caps check)"

      - name: Lean toolchain and shared Mathlib packages
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          mkdir -p .lake
          if [ ! -e .lake/packages ]; then ln -s "$SHARED_PACKAGES" .lake/packages; fi
          lake --version
          df -h . | tail -1

      - name: Restore the shared build cache if the workspace is empty
        if: hashFiles('.lake/build/lib/lean/Grothe.olean') == ''
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build the scalar kernel proof before concurrent certificate checks
        # The measured scalar power proof peaks at 18.8 GB RSS. Finish it before Lake schedules the ordinary
        # native certificates and cap rows together; its small import closure contains no certificate chunks.
        run: lake build Grothe.Haagerup.ScalarTailRefinement --log-level=warning

      - name: Build Grothe and GrotheCaps (incremental; hours if the caps sources changed)
        run: lake build Grothe GrotheCaps --log-level=warning

      - name: Axiom reports (default target and caps target)
        run: |
          lake env lean scratch/Axioms.lean > axioms.txt; python3 scripts/check_axioms.py < axioms.txt
          lake env lean scratch/AxiomsCaps.lean > axioms-caps.txt; python3 scripts/check_axioms.py --caps < axioms-caps.txt

      - name: Mark the cached GrotheCaps build as verified for these sources, and record the built commit
        run: |
          python3 scripts/caps_stamp.py --mark-cache
          # Record which tree the runner built; consumers restore Actions caches, not this workspace.
          git rev-parse HEAD > .lake/build/built-commit

      - name: Lower-proof comment leaves the verified caps cache valid
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          original_head=$(git rev-parse HEAD)
          original_ref=$(git symbolic-ref -q HEAD || true)
          probe_branch="codex/caps-comment-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if git show-ref --verify --quiet "refs/heads/$probe_branch"; then
            echo "Probe branch already exists; refusing to reuse it" >&2
            exit 1
          fi
          row_file=Grothe/LowerAnalytic/Bridge.lean
          row_backup=$(mktemp)
          cp "$row_file" "$row_backup"
          probe_created=false
          cleanup() {
            result=$?
            trap - EXIT
            # The backup also restores exact bytes if the Python process is interrupted.
            cp "$row_backup" "$row_file" || result=1
            if [ "$probe_created" = true ]; then
              if [ -n "$original_ref" ]; then
                git switch "${original_ref#refs/heads/}" || result=1
              else
                git switch --detach "$original_head" || result=1
              fi
              if [ "$(git rev-parse "refs/heads/$probe_branch")" = "$original_head" ]; then
                git branch -D "$probe_branch" || result=1
              else
                echo "Probe branch moved unexpectedly; refusing to delete it" >&2
                result=1
              fi
            fi
            rm -f "$row_backup" || result=1
            [ "$(git rev-parse HEAD)" = "$original_head" ] || result=1
            [ "$(git symbolic-ref -q HEAD || true)" = "$original_ref" ] || result=1
            git diff --quiet && git diff --cached --quiet || result=1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          git switch -c "$probe_branch" "$original_head"
          probe_created=true
          # The preceding build and audits supplied the genuine marker. Do not mark again.
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import sys

          path = Path("Grothe/LowerAnalytic/Bridge.lean")
          original = path.read_bytes()
          try:
              path.write_bytes(original + b"\n-- CI scratch probe: lower-proof comments leave caps computation unchanged.\n")
              subprocess.run([sys.executable, "scripts/caps_stamp.py", "--check-cache"], check=True)
          finally:
              path.write_bytes(original)
          PYTHON
          # EXIT restores HEAD/ref and removes the scratch branch before any cache is saved.

      - name: Save the shared build cache (warm on master)
        if: inputs.mode == 'warm' && github.ref_name == 'master'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Save the build cache for this branch (caps)
        if: inputs.mode == 'caps'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}-caps-${{ github.run_id }}

      - name: Re-dispatch the check of this branch (caps)
        if: inputs.mode == 'caps'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lean.yml --ref "${GITHUB_REF_NAME}"
