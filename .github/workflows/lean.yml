name: Lean proof check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build the Lean development (Mathlib from cache)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--log-level=warning"

      - name: No sorry anywhere
        run: |
          ! grep -rn --include='*.lean' -E '\bsorry\b' Grothe GrotheKernel Grothe.lean

      - name: Axiom report
        run: |
          lake env lean scratch/Axioms.lean | tee axioms.txt
          python3 scripts/check_axioms.py < axioms.txt
