name: Cancel checks of merged branches

# When a pull request is merged (or a branch is deleted), the branch's own proof-check runs are redundant: master's
# check verifies the merged tree and saves the cache. Cancel them at once to save runner minutes, and delete the
# branch's build caches (only master's cache is reused afterwards; the 10 GB quota is shared). Master is never
# touched; neither are other branches.

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel the branch's running and queued proof checks
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = master ]; then echo "nothing to do"; exit 0; fi
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/lean.yml/runs?branch=${BRANCH}&per_page=50" \
            --jq '.workflow_runs[] | select(.status != "completed") | .id')
          for id in $ids; do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 \
              && echo "cancelled run $id of $BRANCH" || echo "run $id: could not cancel (already finished?)"
          done
          [ -n "$ids" ] || echo "no running check of $BRANCH"
      - name: Delete the branch's build caches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.ref }}
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = master ]; then exit 0; fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?ref=refs/heads/${BRANCH}&per_page=100" --jq '.actions_caches[].id' |
            while read -r id; do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null && echo "deleted cache ${id} of ${BRANCH}" || true
            done
