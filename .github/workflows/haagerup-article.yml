name: Haagerup article (Lean)

# The Lean package of the article in haagerup-article/: haagerup-article/anc (the arXiv ancillary files), a
# self-contained Lake package that depends on Mathlib only and has its own lakefile, lean-toolchain and
# lake-manifest.json. This job tests that package alone: it has no sorry, axiom or unchecked code; it builds with its
# pinned Lean and Mathlib, with warnings as errors; and its six public theorems depend on no axioms beyond propext,
# Classical.choice, Quot.sound and the native_decide facts listed in haagerup-article/anc/native.txt, each of which
# is used (haagerup-article/anc/check_axioms.py). The Python scripts under haagerup-article/anc/scripts/ are not part
# of the proof; the job only checks that they compile.
# It runs when a file under haagerup-article/anc/ changes, when this file changes, or by hand (workflow_dispatch).
# Edits of the article's text (main.tex, main.pdf, figures/, README.md) do not run it.

on:
  push:
    paths:
      - 'haagerup-article/anc/**'
      - '.github/workflows/haagerup-article.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haagerup-article-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: No sorry, axiom or unchecked code
        run: |
          ! grep -rn --include='*.lean' --exclude-dir=.lake -E '\bsorry\b|^[[:space:]]*(private[[:space:]]+)?axiom[[:space:]]|implemented_by|@\[extern|\bunsafe\b|debug\.skipKernelTC|Task\.spawn' haagerup-article/anc

      - name: The scripts compile (they are not run and are not part of the proof)
        working-directory: haagerup-article/anc
        run: python3 -m py_compile check_axioms.py scripts/*.py

      - name: Lean toolchain and Mathlib (from the Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: haagerup-article/anc
          use-mathlib-cache: true
          use-github-cache: false
          build: false

      - name: Build the package (warnings are errors)
        working-directory: haagerup-article/anc
        run: lake build --wfail

      - name: Axioms (standard ones and the listed native_decide facts only)
        working-directory: haagerup-article/anc
        run: |
          set -o pipefail
          lake env lean Axioms.lean | tee axioms.txt
          python3 check_axioms.py axioms.txt
