name = "grothe"
defaultTargets = ["Grothe"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert"
rev = "7f91b6eb3567437f6cfac03ed279706603ee22f4"

# The cap checker is its own precompiled library. A module that imports a precompiled library depends on that
# library's whole shared object, built from its root file: with the cap checker inside GrotheKernel, any new or
# changed checker there invalidated all 15 heavy node-cap modules (about 21 CPU-hours).
[[lean_lib]]
name = "GrotheCapsKernel"
precompileModules = true

# The quadrature checker (energy table, issue #303): its own precompiled, Mathlib-free library
# for the same reason as the cap checker.
[[lean_lib]]
name = "GrotheQuadKernel"
precompileModules = true

# Extensions of the quadrature checker (the upper-closure port's twisted kernel, the omitted pairs, ...): their own
# precompiled library, so that GrotheQuadKernel stays frozen. The 13 energy-table facts import GrotheQuadKernel, and any
# module added to or changed in that library makes them all recompile (about ten hours each).
[[lean_lib]]
name = "GrotheQuadExtKernel"
precompileModules = true

[[lean_lib]]
name = "GrotheKernel"
precompileModules = true

[[lean_lib]]
name = "Grothe"


# The batch driver of the quadrature checker (issue #303): a native executable over GrotheQuadKernel.
# Not a default target; CI never builds it.
[[lean_exe]]
name = "quadrun"
root = "QuadRun"
