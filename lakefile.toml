name = "grothe"
defaultTargets = ["Grothe"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert"
rev = "7f91b6eb3567437f6cfac03ed279706603ee22f4"

# The cap checker is its own precompiled, Mathlib-free library. A module that imports a precompiled library depends
# on that library's whole shared object, built from its root file, so any module added to or changed in it invalidates
# every node-cap module (hundreds of CPU-hours): keep it frozen, and never import other kernel code into it.
[[lean_lib]]
name = "GrotheCapsKernel"
precompileModules = true

[[lean_lib]]
name = "Grothe"
